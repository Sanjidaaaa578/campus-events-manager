<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Events - Campus Events Manager</title>
  <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/custom.css">
</head>
<body>
  <div id="navbar-container"></div>

  <!-- Header Section -->
  <section class="bg-dark text-white py-4 mb-4 border-bottom border-secondary border-opacity-25" style="background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%) !important;">
    <div class="container py-2">
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
        <div>
          <span class="badge bg-primary bg-opacity-25 text-white border border-primary border-opacity-50 px-3 py-1 mb-2">EXPLORE & DISCOVER</span>
          <h2 class="fw-bold mb-1 text-white"><i class="bi bi-compass text-indigo-400 me-2"></i> Campus Events Catalog</h2>
          <p class="text-light opacity-75 small mb-0">Browse scheduled hackathons, academic lectures, athletic matches, and student workshops</p>
        </div>
      </div>
    </div>
  </section>

  <div class="container pb-5">
    <!-- Filters & Search Toolbar -->
    <div class="card p-4 shadow-sm mb-4 border-0">
      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label small fw-semibold text-muted">Search Keyword or Venue</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input type="text" id="filter-keyword" class="form-control" placeholder="Search title or venue..." data-testid="filter-keyword">
          </div>
        </div>

        <div class="col-md-2">
          <label class="form-label small fw-semibold text-muted">Category</label>
          <select id="filter-category" class="form-select" data-testid="filter-category">
            <option value="">All Categories</option>
            <option value="Technology">Technology</option>
            <option value="Workshop">Workshop</option>
            <option value="Sports">Sports</option>
            <option value="Career">Career</option>
            <option value="Academic">Academic</option>
            <option value="Social">Social</option>
          </select>
        </div>

        <div class="col-md-2">
          <label class="form-label small fw-semibold text-muted">From Date</label>
          <input type="date" id="filter-start-date" class="form-control" data-testid="filter-start-date">
        </div>

        <div class="col-md-2">
          <label class="form-label small fw-semibold text-muted">To Date</label>
          <input type="date" id="filter-end-date" class="form-control" data-testid="filter-end-date">
        </div>

        <div class="col-md-2">
          <label class="form-label small fw-semibold text-muted">Sort By</label>
          <select id="filter-sort" class="form-select" data-testid="filter-sort">
            <option value="date">Date (Earliest)</option>
            <option value="title">Title (A-Z)</option>
            <option value="capacity">Capacity (Highest)</option>
          </select>
        </div>
      </div>

      <div class="d-flex justify-content-between align-items-center mt-3 pt-3 border-top flex-wrap gap-2">
        <div class="text-muted small">
          <i class="bi bi-info-circle me-1"></i> Filter events by timeline, category, and capacity
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-outline-secondary btn-sm px-3" onclick="resetFilters()">
            <i class="bi bi-arrow-counterclockwise me-1"></i> Reset
          </button>
          <button class="btn btn-primary btn-sm px-4 fw-semibold" onclick="applyFilters()" data-testid="apply-filters-btn">
            <i class="bi bi-funnel me-1"></i> Apply Filters
          </button>
        </div>
      </div>
    </div>

    <!-- Events Grid -->
    <div id="events-catalog-container" class="row g-4">
      <div class="col-12 spinner-container">
        <div class="spinner-border text-primary" role="status"></div>
      </div>
    </div>

    <!-- Pagination -->
    <div id="pagination-controls" class="d-flex justify-content-center mt-5"></div>
  </div>

  <footer class="py-4 mt-auto">
    <div class="container text-center">
      <p class="mb-0 text-muted small">&copy; 2026 Campus Events Manager. All rights reserved.</p>
    </div>
  </footer>

  <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/events.js"></script>
</body>
</html>
