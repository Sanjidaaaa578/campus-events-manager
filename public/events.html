<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Events - Campus Events Manager</title>
  <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/custom.css">
</head>
<body>
  <div id="navbar-container"></div>

  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h2 class="fw-bold mb-1"><i class="bi bi-compass text-primary me-2"></i> Campus Events Catalog</h2>
        <p class="text-muted small mb-0">Browse, filter, and register for student activities</p>
      </div>
    </div>

    <!-- Filters & Search Toolbar -->
    <div class="card p-3 shadow-sm mb-4 border-0">
      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label small fw-semibold">Search Keyword</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input type="text" id="filter-keyword" class="form-control" placeholder="Search title or venue..." data-testid="filter-keyword">
          </div>
        </div>

        <div class="col-md-2">
          <label class="form-label small fw-semibold">Category</label>
          <select id="filter-category" class="form-select" data-testid="filter-category">
            <option value="">All Categories</option>
            <option value="Technology">Technology</option>
            <option value="Workshop">Workshop</option>
            <option value="Sports">Sports</option>
            <option value="Career">Career</option>
            <option value="Academic">Academic</option>
            <option value="Social">Social</option>
          </select>
        </div>

        <div class="col-md-2">
          <label class="form-label small fw-semibold">From Date</label>
          <input type="date" id="filter-start-date" class="form-control" data-testid="filter-start-date">
        </div>

        <div class="col-md-2">
          <label class="form-label small fw-semibold">To Date</label>
          <input type="date" id="filter-end-date" class="form-control" data-testid="filter-end-date">
        </div>

        <div class="col-md-2">
          <label class="form-label small fw-semibold">Sort By</label>
          <select id="filter-sort" class="form-select" data-testid="filter-sort">
            <option value="date">Date (Earliest)</option>
            <option value="title">Title (A-Z)</option>
            <option value="capacity">Capacity (Highest)</option>
          </select>
        </div>
      </div>

      <div class="d-flex justify-content-end gap-2 mt-3 pt-2 border-top">
        <button class="btn btn-outline-secondary btn-sm" onclick="resetFilters()">Reset</button>
        <button class="btn btn-primary btn-sm px-4 fw-semibold" onclick="applyFilters()" data-testid="apply-filters-btn">
          <i class="bi bi-funnel me-1"></i> Apply Filters
        </button>
      </div>
    </div>

    <!-- Events Grid -->
    <div id="events-catalog-container" class="row g-4">
      <div class="col-12 spinner-container">
        <div class="spinner-border text-primary" role="status"></div>
      </div>
    </div>

    <!-- Pagination -->
    <div id="pagination-controls" class="d-flex justify-content-center mt-4"></div>
  </div>

  <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/events.js"></script>
</body>
</html>
