<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Campus Events Manager</title>
  <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-light">
  <div id="navbar-container"></div>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-6">
        <div class="card shadow border-0 p-4">
          <div class="text-center mb-4">
            <i class="bi bi-person-plus text-primary display-4"></i>
            <h2 class="fw-bold mt-2">Create an Account</h2>
            <p class="text-muted small">Join the campus events community</p>
          </div>

          <form id="register-form" novalidate onsubmit="handleRegisterSubmit(event)">
            <div class="mb-3">
              <label for="reg-name" class="form-label fw-semibold">Full Name</label>
              <input type="text" id="reg-name" class="form-control" placeholder="Alex Johnson" required data-testid="register-name">
              <div class="invalid-feedback">Name is required.</div>
            </div>

            <div class="mb-3">
              <label for="reg-email" class="form-label fw-semibold">Campus Email</label>
              <input type="email" id="reg-email" class="form-control" placeholder="alex@campus.edu" required data-testid="register-email">
              <div class="invalid-feedback">Valid campus email is required.</div>
            </div>

            <div class="mb-3">
              <label for="reg-password" class="form-label fw-semibold">Password</label>
              <input type="password" id="reg-password" class="form-control" placeholder="At least 6 characters" required data-testid="register-password">
              <div class="invalid-feedback">Password is required.</div>
            </div>

            <div class="row g-3 mb-4">
              <div class="col-md-6">
                <label for="reg-role" class="form-label fw-semibold">Account Role</label>
                <select id="reg-role" class="form-select" data-testid="register-role">
                  <option value="Student" selected>Student</option>
                  <option value="Organizer">Event Organizer</option>
                  <option value="Admin">Administrator</option>
                </select>
              </div>
              <div class="col-md-6">
                <label for="reg-dept" class="form-label fw-semibold">Department / Faculty</label>
                <input type="text" id="reg-dept" class="form-control" placeholder="Software Engineering" data-testid="register-dept">
              </div>
            </div>

            <button type="submit" id="register-btn" class="btn btn-primary w-100 py-2 fw-semibold" data-testid="register-submit-btn">
              <span id="btn-text">Create Account</span>
              <span id="btn-spinner" class="spinner-border spinner-border-sm d-none ms-2" role="status"></span>
            </button>
          </form>

          <div class="mt-4 text-center">
            <p class="text-muted small mb-0">Already registered? <a href="login.html" class="fw-semibold text-primary">Log in here</a></p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
