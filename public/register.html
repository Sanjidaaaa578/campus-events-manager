<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create an Account - Campus Events Manager</title>
  <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-light">
  <div id="navbar-container"></div>

  <div class="auth-wrapper">
    <div class="auth-glow-bg"></div>

    <div class="auth-card" style="max-width: 540px;">
      <div class="text-center mb-4">
        <div class="auth-icon-circle mx-auto">
          <i class="bi bi-person-plus"></i>
        </div>
        <h2 class="fw-bold mb-1">Create an Account</h2>
        <p class="text-muted small mb-0">Join the campus events community to explore and register</p>
      </div>

      <form id="register-form" novalidate onsubmit="handleRegisterSubmit(event)">
        <div class="mb-3">
          <label for="reg-name" class="form-label fw-semibold small text-muted">Full Name</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            <input type="text" id="reg-name" class="form-control" placeholder="Alex Johnson" required data-testid="register-name">
          </div>
          <div class="invalid-feedback">Name is required.</div>
        </div>

        <div class="mb-3">
          <label for="reg-email" class="form-label fw-semibold small text-muted">Campus Email Address</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input type="email" id="reg-email" class="form-control" placeholder="alex@campus.edu" required data-testid="register-email">
          </div>
          <div class="invalid-feedback">Valid campus email is required.</div>
        </div>

        <div class="mb-3">
          <label for="reg-password" class="form-label fw-semibold small text-muted">Password (at least 6 characters)</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-key"></i></span>
            <input type="password" id="reg-password" class="form-control" placeholder="••••••••" required data-testid="register-password">
          </div>
          <div class="invalid-feedback">Password is required.</div>
        </div>

        <div class="row g-3 mb-4">
          <div class="col-md-6">
            <label for="reg-role" class="form-label fw-semibold small text-muted">Account Role</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-shield-check"></i></span>
              <select id="reg-role" class="form-select" data-testid="register-role">
                <option value="Student" selected>Student</option>
                <option value="Organizer">Event Organizer</option>
                <option value="Admin">Administrator</option>
              </select>
            </div>
          </div>
          <div class="col-md-6">
            <label for="reg-dept" class="form-label fw-semibold small text-muted">Department / Faculty</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-building"></i></span>
              <input type="text" id="reg-dept" class="form-control" placeholder="Software Engineering" data-testid="register-dept">
            </div>
          </div>
        </div>

        <button type="submit" id="register-btn" class="btn btn-primary w-100 py-2 fw-semibold" data-testid="register-submit-btn">
          <span id="btn-text"><i class="bi bi-check-circle me-2"></i>Create Account</span>
          <span id="btn-spinner" class="spinner-border spinner-border-sm d-none ms-2" role="status"></span>
        </button>
      </form>

      <div class="mt-4 text-center">
        <p class="text-muted small mb-0">Already registered? <a href="login.html" class="fw-semibold text-primary text-decoration-none">Sign in here</a></p>
      </div>
    </div>
  </div>

  <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
