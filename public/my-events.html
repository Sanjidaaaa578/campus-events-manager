<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Organized Events - Campus Events Manager</title>
  <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/custom.css">
</head>
<body>
  <div id="navbar-container"></div>

  <div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h2 class="fw-bold mb-1"><i class="bi bi-kanban text-primary me-2"></i> My Organized Events</h2>
        <p class="text-muted small mb-0">Manage your event proposals, attendee rosters, and updates</p>
      </div>
      <a href="create-event.html" class="btn btn-primary fw-semibold"><i class="bi bi-plus-circle me-1"></i> Create New Event</a>
    </div>

    <div class="card shadow-sm border-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th scope="col" class="ps-4">Title & Details</th>
              <th scope="col">Date & Venue</th>
              <th scope="col">Status</th>
              <th scope="col">Capacity</th>
              <th scope="col" class="text-end pe-4">Actions</th>
            </tr>
          </thead>
          <tbody id="my-events-table-body">
            <tr>
              <td colspan="5" class="text-center py-4">
                <div class="spinner-border text-primary spinner-border-sm" role="status"></div>
                <span class="ms-2 text-muted small">Loading your events...</span>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/my-events.js"></script>
</body>
</html>
