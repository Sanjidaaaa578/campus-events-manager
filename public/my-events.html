<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Organized Events - Campus Events Manager</title>
  <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-light">
  <div id="navbar-container"></div>

  <!-- Header Banner -->
  <section class="bg-dark text-white py-4 mb-4 border-bottom border-secondary border-opacity-25" style="background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%) !important;">
    <div class="container py-2">
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
        <div>
          <span class="badge bg-primary bg-opacity-25 text-white border border-primary border-opacity-50 px-3 py-1 mb-2">ORGANIZER CONSOLE</span>
          <h2 class="fw-bold mb-1 text-white"><i class="bi bi-kanban text-indigo-400 me-2"></i> My Organized Events</h2>
          <p class="text-light opacity-75 small mb-0">Oversee event proposals, attendee rosters, updates, and broadcast notifications</p>
        </div>
        <a href="create-event.html" class="btn btn-primary btn-sm px-3 shadow-sm">
          <i class="bi bi-plus-circle me-1"></i> Create New Event
        </a>
      </div>
    </div>
  </section>

  <div class="container pb-5">
    <div class="card shadow-sm border-0 rounded-4 overflow-hidden">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead>
            <tr>
              <th scope="col" class="ps-4">Title & Category</th>
              <th scope="col">Schedule & Venue</th>
              <th scope="col">Approval Status</th>
              <th scope="col">Capacity</th>
              <th scope="col" class="text-end pe-4">Actions</th>
            </tr>
          </thead>
          <tbody id="my-events-table-body">
            <tr>
              <td colspan="5" class="text-center py-5">
                <div class="spinner-border text-primary spinner-border-sm" role="status"></div>
                <span class="ms-2 text-muted small">Loading your events...</span>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <footer class="py-4 mt-auto">
    <div class="container text-center">
      <p class="mb-0 text-muted small">&copy; 2026 Campus Events Manager. All rights reserved.</p>
    </div>
  </footer>

  <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/my-events.js"></script>
</body>
</html>
