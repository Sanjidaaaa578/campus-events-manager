<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Event - Campus Events Manager</title>
  <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/custom.css">
</head>
<body>
  <div id="navbar-container"></div>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card p-4 shadow-sm border-0">
          <div class="d-flex align-items-center mb-4">
            <i class="bi bi-pencil-square text-primary display-5 me-3"></i>
            <div>
              <h2 class="fw-bold mb-0">Edit Event Details</h2>
              <p class="text-muted small mb-0">Updates will automatically notify all registered attendees</p>
            </div>
          </div>

          <form id="edit-event-form" novalidate onsubmit="handleEditEvent(event)">
            <div class="mb-3">
              <label for="edit-title" class="form-label fw-semibold">Event Title *</label>
              <input type="text" id="edit-title" class="form-control" required data-testid="edit-title">
              <div class="invalid-feedback">Title is required.</div>
            </div>

            <div class="mb-3">
              <label for="edit-desc" class="form-label fw-semibold">Description</label>
              <textarea id="edit-desc" class="form-control" rows="4" data-testid="edit-desc"></textarea>
            </div>

            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label for="edit-date" class="form-label fw-semibold">Date *</label>
                <input type="date" id="edit-date" class="form-control" required data-testid="edit-date">
              </div>
              <div class="col-md-6">
                <label for="edit-time" class="form-label fw-semibold">Time *</label>
                <input type="time" id="edit-time" class="form-control" required data-testid="edit-time">
              </div>
            </div>

            <div class="row g-3 mb-4">
              <div class="col-md-5">
                <label for="edit-venue" class="form-label fw-semibold">Venue *</label>
                <input type="text" id="edit-venue" class="form-control" required data-testid="edit-venue">
              </div>
              <div class="col-md-3">
                <label for="edit-capacity" class="form-label fw-semibold">Capacity *</label>
                <input type="number" id="edit-capacity" class="form-control" min="1" required data-testid="edit-capacity">
              </div>
              <div class="col-md-4">
                <label for="edit-category" class="form-label fw-semibold">Category *</label>
                <select id="edit-category" class="form-select" data-testid="edit-category">
                  <option value="Technology">Technology</option>
                  <option value="Workshop">Workshop</option>
                  <option value="Sports">Sports</option>
                  <option value="Career">Career</option>
                  <option value="Academic">Academic</option>
                  <option value="Social">Social</option>
                </select>
              </div>
            </div>

            <div class="d-flex justify-content-end gap-2 border-top pt-3">
              <a href="my-events.html" class="btn btn-outline-secondary">Cancel</a>
              <button type="submit" id="save-event-btn" class="btn btn-primary px-4 fw-semibold" data-testid="edit-submit-btn">
                Save & Broadcast Updates
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/edit-event.js"></script>
</body>
</html>
