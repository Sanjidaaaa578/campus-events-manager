<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Details - Campus Events Manager</title>
  <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-light">
  <div id="navbar-container"></div>

  <div class="container py-4">
    <div class="mb-4">
      <a href="events.html" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
        <i class="bi bi-arrow-left me-1"></i> Back to Catalog
      </a>
    </div>

    <div id="details-loading" class="spinner-container">
      <div class="spinner-border text-primary" role="status"></div>
      <p class="text-muted mt-2">Loading event details...</p>
    </div>

    <div id="details-content" class="row g-4 d-none">
      <!-- Main Details Column -->
      <div class="col-lg-8">
        <div class="card p-4 p-md-5 shadow-sm border-0 mb-4 rounded-4">
          <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
            <span id="event-category-badge" class="badge bg-primary px-3 py-2 fw-semibold fs-6"></span>
            <span id="event-status-badge" class="badge"></span>
          </div>
          <h1 id="event-title" class="fw-bold mb-3 display-6" style="letter-spacing: -0.02em;"></h1>
          <p id="event-description" class="text-muted fs-6 mb-4" style="line-height: 1.7;"></p>

          <!-- Highlights Row -->
          <div class="row g-3 p-3 bg-light rounded-4 mb-4 border">
            <div class="col-sm-6">
              <div class="d-flex align-items-center">
                <div class="event-meta-icon meta-icon-date me-3" style="width: 44px; height: 44px; font-size: 1.25rem; border-radius: 12px;">
                  <i class="bi bi-calendar3"></i>
                </div>
                <div>
                  <small class="text-muted d-block text-uppercase fw-semibold" style="font-size: 0.72rem;">Date & Time</small>
                  <strong id="event-datetime" class="text-dark"></strong>
                </div>
              </div>
            </div>
            <div class="col-sm-6">
              <div class="d-flex align-items-center">
                <div class="event-meta-icon meta-icon-venue me-3" style="width: 44px; height: 44px; font-size: 1.25rem; border-radius: 12px;">
                  <i class="bi bi-geo-alt"></i>
                </div>
                <div>
                  <small class="text-muted d-block text-uppercase fw-semibold" style="font-size: 0.72rem;">Campus Venue</small>
                  <strong id="event-venue" class="text-dark"></strong>
                </div>
              </div>
            </div>
          </div>

          <!-- Organizer Information -->
          <div class="p-3 rounded-3 bg-white border d-flex align-items-center gap-3">
            <div class="bg-primary-subtle text-primary p-3 rounded-circle" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;">
              <i class="bi bi-person-badge fs-4"></i>
            </div>
            <div>
              <small class="text-muted d-block fw-semibold text-uppercase" style="font-size: 0.72rem;">Event Organizer</small>
              <span class="fw-bold text-dark" id="event-organizer-name"></span>
              <span class="text-muted small ms-1">(<span id="event-organizer-email"></span>)</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Registration Card Column -->
      <div class="col-lg-4">
        <div class="card p-4 shadow-sm border-0 sticky-top rounded-4" style="top: 5.5rem;">
          <h4 class="fw-bold mb-3 d-flex align-items-center">
            <i class="bi bi-ticket-perforated text-primary me-2"></i> Registration
          </h4>

          <!-- Capacity Bar -->
          <div class="mb-3 p-3 bg-light rounded-3 border">
            <div class="d-flex justify-content-between small fw-bold mb-2">
              <span class="text-muted">Seat Occupancy</span>
              <span id="capacity-text" class="text-dark">0 / 0</span>
            </div>
            <div class="progress mb-2" style="height: 10px; border-radius: var(--radius-full);">
              <div id="capacity-bar" class="progress-bar bg-success" role="progressbar" style="width: 0%"></div>
            </div>
            <small id="capacity-status-text" class="text-muted d-block" style="font-size: 0.8rem; line-height: 1.4;"></small>
          </div>

          <!-- Registration Action Box -->
          <div id="action-box" class="pt-2">
            <button id="register-btn" class="btn btn-primary btn-lg w-100 fw-semibold py-3 shadow-sm" onclick="handleRegistrationAction()" data-testid="event-action-btn">
              Register for Event
            </button>
            <p id="user-status-notice" class="small text-center text-muted mt-2 mb-0"></p>
          </div>

          <!-- Automated Waitlist Notice -->
          <div class="mt-4 pt-3 border-top text-muted small">
            <div class="d-flex align-items-start gap-2">
              <i class="bi bi-shield-check text-success fs-5"></i>
              <div>
                <strong>Smart Waitlist Guarantee:</strong> If the event is full, you are queued automatically and promoted when a seat opens.
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer class="py-4 mt-auto">
    <div class="container text-center">
      <p class="mb-0 text-muted small">&copy; 2026 Campus Events Manager. All rights reserved.</p>
    </div>
  </footer>

  <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/event-details.js"></script>
</body>
</html>
