<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Registrations - Campus Events Manager</title>
  <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/custom.css">
</head>
<body>
  <div id="navbar-container"></div>

  <div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h2 class="fw-bold mb-1"><i class="bi bi-ticket-perforated text-primary me-2"></i> My Registered Events</h2>
        <p class="text-muted small mb-0">Track your confirmed seats and waiting list queues</p>
      </div>
      <a href="events.html" class="btn btn-outline-primary btn-sm"><i class="bi bi-plus-lg me-1"></i> Register for More Events</a>
    </div>

    <!-- Tabs: Confirmed vs Waitlisted -->
    <ul class="nav nav-pills mb-4" id="regTabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active px-4 fw-semibold" id="confirmed-tab" data-bs-toggle="pill" data-bs-target="#confirmed-pane" type="button" role="tab">
          <i class="bi bi-check-circle me-1"></i> Confirmed (<span id="confirmed-count">0</span>)
        </button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link px-4 fw-semibold" id="waitlisted-tab" data-bs-toggle="pill" data-bs-target="#waitlisted-pane" type="button" role="tab">
          <i class="bi bi-clock-history me-1"></i> Waiting List (<span id="waitlist-count">0</span>)
        </button>
      </li>
    </ul>

    <div class="tab-content" id="regTabsContent">
      <div class="tab-pane fade show active" id="confirmed-pane" role="tabpanel">
        <div id="confirmed-list" class="row g-4">
          <div class="col-12 spinner-container"><div class="spinner-border text-primary"></div></div>
        </div>
      </div>

      <div class="tab-pane fade" id="waitlisted-pane" role="tabpanel">
        <div id="waitlisted-list" class="row g-4">
          <div class="col-12 spinner-container"><div class="spinner-border text-primary"></div></div>
        </div>
      </div>
    </div>
  </div>

  <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/my-registrations.js"></script>
</body>
</html>
