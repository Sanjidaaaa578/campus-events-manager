<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Campus Events Manager</title>
  <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-light">
  <div id="navbar-container"></div>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card shadow border-0 p-4">
          <div class="text-center mb-4">
            <i class="bi bi-person-lock text-primary display-4"></i>
            <h2 class="fw-bold mt-2">Welcome Back</h2>
            <p class="text-muted small">Sign in to manage and register for campus events</p>
          </div>

          <form id="login-form" novalidate onsubmit="handleLoginSubmit(event)">
            <div class="mb-3">
              <label for="email" class="form-label fw-semibold">Email Address</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                <input type="email" id="email" class="form-control" placeholder="name@campus.edu" required data-testid="login-email">
              </div>
              <div id="email-feedback" class="invalid-feedback">Please enter a valid email address.</div>
            </div>

            <div class="mb-4">
              <label for="password" class="form-label fw-semibold">Password</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-key"></i></span>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required data-testid="login-password">
              </div>
              <div id="password-feedback" class="invalid-feedback">Password is required.</div>
            </div>

            <button type="submit" id="login-btn" class="btn btn-primary w-100 py-2 fw-semibold" data-testid="login-submit-btn">
              <span id="btn-text">Sign In</span>
              <span id="btn-spinner" class="spinner-border spinner-border-sm d-none ms-2" role="status"></span>
            </button>
          </form>

          <div class="mt-4 text-center">
            <p class="text-muted small mb-0">Don't have an account? <a href="register.html" class="fw-semibold text-primary">Register here</a></p>
          </div>

          <div class="alert alert-info mt-4 mb-0 small">
            <strong><i class="bi bi-info-circle me-1"></i> Demo Accounts:</strong><br>
            • Admin: <code>admin@campus.edu</code> (pass: <code>password123</code>)<br>
            • Organizer: <code>organizer1@campus.edu</code><br>
            • Student: <code>alex@campus.edu</code>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
