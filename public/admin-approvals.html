<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Approvals - Campus Events Manager</title>
  <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/custom.css">
</head>
<body>
  <div id="navbar-container"></div>

  <div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h2 class="fw-bold mb-1"><i class="bi bi-shield-check text-primary me-2"></i> Event Review & Approvals</h2>
        <p class="text-muted small mb-0">Approve or reject organizer proposals before publishing</p>
      </div>
      <a href="admin-dashboard.html" class="btn btn-outline-primary btn-sm"><i class="bi bi-speedometer2 me-1"></i> Admin Analytics</a>
    </div>

    <div class="card shadow-sm border-0">
      <div class="card-header bg-white py-3">
        <h5 class="fw-bold mb-0 text-warning"><i class="bi bi-hourglass-split me-2"></i> Pending Submissions (<span id="pending-count">0</span>)</h5>
      </div>
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th scope="col" class="ps-4">Title & Category</th>
              <th scope="col">Organizer</th>
              <th scope="col">Date, Time & Venue</th>
              <th scope="col">Capacity</th>
              <th scope="col" class="text-end pe-4">Decision Actions</th>
            </tr>
          </thead>
          <tbody id="approvals-table-body">
            <tr><td colspan="5" class="text-center py-4 text-muted"><div class="spinner-border spinner-border-sm text-primary"></div></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/admin-approvals.js"></script>
</body>
</html>
