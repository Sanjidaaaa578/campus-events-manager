<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Approvals - Campus Events Manager</title>
  <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-light">
  <div id="navbar-container"></div>

  <!-- Header Banner -->
  <section class="bg-dark text-white py-4 mb-4 border-bottom border-secondary border-opacity-25" style="background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%) !important;">
    <div class="container py-2">
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
        <div>
          <span class="badge bg-warning bg-opacity-25 text-warning border border-warning border-opacity-50 px-3 py-1 mb-2">ADMIN REVIEW</span>
          <h2 class="fw-bold mb-1 text-white"><i class="bi bi-shield-check text-warning me-2"></i> Event Review & Approvals</h2>
          <p class="text-light opacity-75 small mb-0">Review pending organizer proposals before publishing to the campus catalog</p>
        </div>
        <a href="admin-dashboard.html" class="btn btn-primary btn-sm px-3 shadow-sm">
          <i class="bi bi-speedometer2 me-1"></i> View Analytics
        </a>
      </div>
    </div>
  </section>

  <div class="container pb-5">
    <div class="card shadow-sm border-0 rounded-4 overflow-hidden">
      <div class="card-header bg-white py-3 border-bottom d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center">
          <i class="bi bi-hourglass-split text-warning me-2 fs-5"></i>
          <h5 class="fw-bold mb-0 text-dark">Pending Submissions</h5>
        </div>
        <span class="badge bg-warning text-dark px-3 py-2 fw-semibold" id="pending-count">0</span>
      </div>
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead>
            <tr>
              <th scope="col" class="ps-4">Title & Details</th>
              <th scope="col">Organizer</th>
              <th scope="col">Date & Venue</th>
              <th scope="col">Capacity</th>
              <th scope="col" class="text-end pe-4">Decision Actions</th>
            </tr>
          </thead>
          <tbody id="approvals-table-body">
            <tr><td colspan="5" class="text-center py-5 text-muted"><div class="spinner-border spinner-border-sm text-primary"></div></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <footer class="py-4 mt-auto">
    <div class="container text-center">
      <p class="mb-0 text-muted small">&copy; 2026 Campus Events Manager. All rights reserved.</p>
    </div>
  </footer>

  <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/admin-approvals.js"></script>
</body>
</html>
